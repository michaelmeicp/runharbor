name: Bug report
description: Report a reproducible problem using non-sensitive example data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use private reporting. Never include tokens, cookies, private prompts, or a full database."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the mock scenario and steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, Node version, OS, browser
    validations:
      required: true
